name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

# Thin wrapper over tinyland-inc/ci-templates' sanctioned Cloudflare Pages
# deploy lane (TIN-3914 Phase B: no GitHub-hosted runners — the template's
# build job runs on tinyland-nix as of v3). The deploy step credential-skips
# with a ::notice:: until the org CF secrets are provisioned; PR events build
# only. Do NOT add a cloudflare-pages-${{ github.ref }} concurrency group
# here — the reusable workflow owns that group and duplicating it deadlocks
# the caller against the called job.

jobs:
  deploy:
    permissions:
      contents: read
      deployments: write
    uses: tinyland-inc/ci-templates/.github/workflows/spoke-deploy-cloudflare-pages.yml@v3.1.0
    # Pass the CF secrets EXPLICITLY. `secrets: inherit` does not reliably
    # deliver repo secrets when the calling repo lives in a DIFFERENT org than
    # ci-templates (observed 2026-07-04: Great-Falls-Tool-Bus spoke built green
    # while the deploy step credential-skipped on every push). Explicit mapping
    # works in both same-org and cross-org callers.
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
